name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  loader-tests:
    name: Loader tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Run loader tests
        run: uv run --locked pytest tests/test_loader.py -q
