[project]
name = "learn-quant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.3",
    "loguru>=0.7.3",
    "lxml>=6.1.1",
    "pandas>=3.0.3",
    "requests>=2.34.2",
    "tabulate>=0.10.0",
    "yfinance>=1.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]      # ← 告诉打包系统:包在 src/pipeline

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
]
